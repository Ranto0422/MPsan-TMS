<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Building icon -->
  <g fill="white">
    <!-- Main building body -->
    <rect x="16" y="22" width="20" height="28" rx="2"/>
    <!-- Roof / triangle -->
    <polygon points="14,24 26,12 38,24"/>
    <!-- Door -->
    <rect x="23" y="38" width="6" height="12" rx="1" fill="#1e40af"/>
    <!-- Windows row 1 -->
    <rect x="19" y="26" width="4" height="4" rx="0.5" fill="#1e40af"/>
    <rect x="27" y="26" width="4" height="4" rx="0.5" fill="#1e40af"/>
    <!-- Windows row 2 -->
    <rect x="19" y="33" width="4" height="4" rx="0.5" fill="#1e40af"/>
    <rect x="27" y="33" width="4" height="4" rx="0.5" fill="#1e40af"/>
    <!-- Key icon (right side) -->
    <circle cx="46" cy="28" r="5" fill="none" stroke="white" stroke-width="2.5"/>
    <line x1="46" y1="33" x2="46" y2="46" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="46" y1="40" x2="50" y2="40" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="46" y1="44" x2="50" y2="44" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
